chip "gigabyte_wmi-virtual-*"
  label temp1       "System"
  label temp2       "Chipset"
  label temp3       "CPU"
  label temp4       "PCIe x16"
  label temp5       "VRM"
  label temp6       "VSoC"

chip "acpitz-acpi-0"
  label temp1       "ACPI Thermal Zone"

chip "it8689_90050606-*"
  label in0         "CPU Vcore"
  label in1         "+3.3V"
  compute in1       @ * 1.649, @ / 1.649
  label in2         "+12.0V"
  compute in2       @ * 6, @ / 6
  label in3         "+5.0V"
  compute in3       @ * 2.5, @ / 2.5
  label in4         "CPU VCORE SOC"
  label in5         "CPU VCORE MISC"
  # label in6         "DRAM CH(A/B)"
  # label in7         "3VSB"
  # label in8         "Battery"
  label temp1       "System 1"
  label temp2       "PCH"
  label temp3       "CPU"
  label temp4       "PCIEX16"
  label temp5       "VRM MOS"
  label temp6       "VSOCMOS"
  label fan1        "CPU Fan"
  label fan2        "SYS_FAN1"
  label fan3        "SYS_FAN2"
  label fan4        "SYS_FAN3"
  label fan5        "CPU_OPT"
  label pwm1        "CPU_FAN"
  label pwm2        "SYS_FAN1"
  label pwm3        "SYS_FAN2"
  label pwm4        "SYS_FAN3"
  label pwm5        "CPU_OPT"
  label intrusion0  "Intrusion"
  # Hide only chip-supported channels not mapped by this SIV configuration.
  ignore in6
  ignore fan6
  ignore pwm6

  set temp1_min     0.00
  set temp1_max     127.00
  set temp2_min     0.00
  set temp2_max     127.00
  set temp3_min     0.00
  set temp3_max     127.00
  set temp4_min     0.00
  set temp4_max     127.00
  set temp5_min     0.00
  set temp5_max     127.00
  set temp6_min     0.00
  set temp6_max     127.00

chip "k10temp-pci-*"
  label temp1       "CPU Fan Ctrl Temp"
  label temp3       "CPU Die Temp"

chip "nvme-pci-*"
  label temp1       "Composite"
  label temp2       "Controller"
  label temp3       "NAND Flash"

  # set temp1_min     0.50
  # set temp1_max     127.50
  # set temp2_min     0.50
  # set temp2_max     127.50
  # set temp3_min     0.10
  # set temp3_max     127.50
